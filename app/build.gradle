plugins { id 'com.android.application' }
android {
    namespace 'com.pplgym.tracker'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pplgym.tracker'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    sourceSets { main { assets.srcDirs = ['../'] } }
    aaptOptions { ignoreAssetsPattern '!*.html:!*.js:!*.css:!*.json:!*.png:!*.svg:!*.webp:!*.jpg:!*.jpeg:!*.gif:!*.ico' }
}
