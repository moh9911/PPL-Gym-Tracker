name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - '*.png'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare bundled web assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html main.js style.css manifest.json icon.png app/src/main/assets/
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PPL-Gym-Tracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
